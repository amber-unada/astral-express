    <form id="demo">
  <fieldset>
    <legend>Drop your details below!</legend>
    <p>
      <label for="nm">Name</label><br>
      <input type="text" id="nm" name="nm" required>
    </p>
    <p>
      <label for="em">Email</label><br>
      <input type="email" id="em" name="em" required>
    </p>
  </fieldset>

    <label for="subject">Subject</label>
    <select id="subject" name="subject" required>
        <option value="" disabled selected>-- Choose Subject --</option>
        <option value="suggestion">Product Status</option>
        <option value="recommendation">Delivery Method</option>
        <option value="feedback">General Inquiry</option>
  </select>

  <p>
    <label for="msg">Feedback/Message</label><br>
    <textarea id="msg" name="msg" rows="3" required></textarea>
  </p>

    <div class="button-container">
        <button type="submit">Send message</button>
    </div>


</form>
