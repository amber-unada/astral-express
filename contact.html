    <head>
    <style>
    div {
    display: flex;
    justify-content: center;
    }

    nav {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 20px;
    margin-bottom: 25px;
    }

    nav ul {
    display: flex;      
    list-style: none;       
    padding: 0;
    margin: 0;
    gap: 20px;              
    }

    footer {
    padding: 50px 20px;
    }

    p {
        text-align: center;
    }

    fieldset {
        max-width: 420px;
        margin: 20px auto;
        padding: 20px 25px;
        border: 2px dashed #ffffff; 
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.1);
    }

    legend {
        margin: 0 auto;
        padding: 0 12px;
        color: #000000;
        font-weight: bold;
        font-size: 1rem;
    }

    input, select, textarea {
        display: block;
        width: 90%;
        margin: 6px auto 14px auto;
        padding: 8px 12px;
        border-radius: 6px;
        border: 1px solid #ffffff;
    }

    textarea {
        display: block;
        margin: 0 auto;
        width: 100%;
        max-width: 300px;
        height: 60px; 
        
        box-sizing: border-box;
        padding: 8px 12px;
        border-radius: 8px;
        resize: vertical;
    }
    </style>

  </fieldset>

  <p>
